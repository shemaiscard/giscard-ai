name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # The job name "build" is the required check on main.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22    # same major as the Netlify functions runtime
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build
