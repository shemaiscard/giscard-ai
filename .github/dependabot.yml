version: 2
updates:
  # Patch and minor updates arrive together in one PR a week; each major update gets its own PR.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The Netlify functions run on Node 22; raise these types together with the runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Keeps the action versions in .github/workflows current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
